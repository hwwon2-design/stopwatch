<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냥이 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #5a3e36;
    --pink: #ff7fa6;
    --pink-soft: #ffd6e3;
    --lav: #d9ccff;
    --lav-deep: #b9a6f0;
    --cream: #fffaf6;
    --mint: #4cc79a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fde8ef 0%, #f6ebff 50%, #e6e0ff 100%);
    color: var(--ink);
    font-family: "Jua", "Fredoka", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 16px 40px;
  }
  .wrap { width: 100%; max-width: 440px; }

  /* ---------- card ---------- */
  .card {
    position: relative;
    border-radius: 36px;
    overflow: hidden;
    background: linear-gradient(180deg, #fff7fb 0%, #f6edff 60%, #ece2ff 100%);
    box-shadow: 0 14px 34px rgba(150, 110, 170, .2), inset 0 0 0 5px #fff;
  }
  .title {
    text-align: center;
    padding-top: 22px;
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--pink);
    text-shadow: 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff, 0 4px 0 #ffd0de;
  }
  .time {
    text-align: center;
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: clamp(56px, 18vw, 86px);
    line-height: 1.1;
    color: var(--ink);
    text-shadow: 0 4px 0 #fff, 0 6px 12px rgba(120, 80, 70, .15);
    white-space: nowrap;
  }
  .time .d { display: inline-block; width: .62em; text-align: center; }
  .time .c { display: inline-block; width: .3em; text-align: center; transform: translateY(-.06em); }
  .time .cs { font-size: .42em; color: #a07d72; margin-left: .08em; }
  .bubble {
    width: fit-content;
    margin: 4px auto 0;
    padding: 6px 16px;
    border-radius: 999px;
    background: #fff;
    color: #b0778a;
    font-size: 15px;
    box-shadow: 0 3px 0 #f3d6e1;
  }
  svg.scene { display: block; width: 100%; height: auto; margin-top: -4px; }

  /* ---------- controls ---------- */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 22px 0 18px;
  }
  button {
    font-family: inherit;
    font-size: 19px;
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    min-width: 120px;
    cursor: pointer;
    color: var(--ink);
    background: #fff;
    box-shadow: 0 5px 0 #e2d6f5;
    transition: transform .08s, box-shadow .08s, opacity .2s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #e2d6f5; }
  button:disabled { opacity: .45; cursor: default; transform: none; }
  button.main { background: var(--pink); color: #fff; box-shadow: 0 5px 0 #e0608a; }
  button.main:active { box-shadow: 0 1px 0 #e0608a; }
  button.main.pause { background: var(--lav-deep); box-shadow: 0 5px 0 #9783d6; }
  button.main.pause:active { box-shadow: 0 1px 0 #9783d6; }

  /* ---------- laps ---------- */
  ul.laps {
    list-style: none;
    margin: 0;
    padding: 0;
    border-radius: 24px;
    background: rgba(255, 255, 255, .7);
    overflow: hidden;
  }
  ul.laps:empty { display: none; }
  .laps li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    font-size: 17px;
    border-bottom: 2px dashed #f0e2f2;
  }
  .laps li:last-child { border-bottom: none; }
  .laps .t { font-family: "Fredoka", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; }
  .laps .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; color: #fff; }
  .laps li.best { color: var(--mint); }
  .laps li.best .tag { background: var(--mint); }
  .laps li.worst { color: var(--pink); }
  .laps li.worst .tag { background: var(--pink); }
  .hint { text-align: center; color: #b49aae; font-size: 14px; margin-top: 18px; }

  /* ---------- scene animations ---------- */
  .fill-box { transform-box: fill-box; transform-origin: center; }

  #head { transform-box: view-box; transform-origin: 200px 222px; animation: tilt 4s ease-in-out infinite; }
  #body { transform-box: view-box; transform-origin: 200px 285px; animation: breathe 3s ease-in-out infinite; }
  #tail { transform-box: view-box; transform-origin: 250px 268px; animation: wag 2.4s ease-in-out infinite; }
  #bird { animation: hop 3.2s ease-in-out infinite; }
  #eyesOpen { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  .steam { animation: steam 2.6s ease-in-out infinite; opacity: 0; }
  .steam.s2 { animation-delay: 1.3s; }
  .flip { transform-box: view-box; transform-origin: 200px 270px; opacity: 0; }

  #eyesHappy, #eyesSleep, #notes, #zzz { display: none; }

  body[data-state="running"] #head { animation: bob .9s ease-in-out infinite; }
  body[data-state="running"] #tail { animation-duration: .9s; }
  body[data-state="running"] #eyesOpen { display: none; }
  body[data-state="running"] #eyesHappy { display: inline; }
  body[data-state="running"] #notes { display: inline; }
  body[data-state="running"] .flip { animation: flip 4s ease-in-out infinite; }
  body[data-state="running"] #bird { animation: hop .9s ease-in-out infinite; }

  body[data-state="paused"] #head { animation: doze 3s ease-in-out infinite; }
  body[data-state="paused"] #eyesOpen { display: none; }
  body[data-state="paused"] #eyesSleep { display: inline; }
  body[data-state="paused"] #zzz { display: inline; }
  body[data-state="paused"] #tail { animation-duration: 5s; }

  .note { animation: float 1.8s ease-out infinite; opacity: 0; }
  .note.n2 { animation-delay: .6s; }
  .note.n3 { animation-delay: 1.2s; }
  .z { animation: float 3s ease-out infinite; opacity: 0; }
  .z.z2 { animation-delay: 1s; }
  .z.z3 { animation-delay: 2s; }

  @keyframes tilt { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes bob { 0%,100% { transform: rotate(-5deg) translateY(0); } 25% { transform: rotate(0) translateY(-4px); } 50% { transform: rotate(5deg) translateY(0); } 75% { transform: rotate(0) translateY(-4px); } }
  @keyframes doze { 0%,100% { transform: rotate(3deg) translateY(2px); } 50% { transform: rotate(5deg) translateY(6px); } }
  @keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.02, 1.035); } }
  @keyframes wag { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
  @keyframes hop { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-10px); } 90% { transform: translateY(0); } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-16px); } }
  @keyframes float { 0% { opacity: 0; transform: translate(0, 0) scale(.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(12px, -38px) scale(1.1); } }
  @keyframes flip { 0%,55% { opacity: 0; transform: scaleX(1); } 60% { opacity: 1; transform: scaleX(1); } 85% { opacity: 1; transform: scaleX(-1); } 90%,100% { opacity: 0; transform: scaleX(-1); } }
  @keyframes fall { from { transform: translateY(-10px); } to { transform: translateY(160px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>

<script>
  const display = document.getElementById('display');
  const bubble = document.getElementById('bubble');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() when current run started
  let elapsed = 0;     // ms accumulated before current run
  let laps = [];       // lap durations in ms
  let lastLapTotal = 0;
  let rafId = null;

  const BUBBLES = {
    idle: '준비됐냥? 🐾',
    running: '집중하는 중이냥 ♪',
    paused: '잠깐 쉬는 중… zZ'
  };

  function setState(state) {
    document.body.dataset.state = state;
    bubble.textContent = BUBBLES[state];
  }

  function now() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function parts(ms) {
    const pad = n => String(n).padStart(2, '0');
    const h = Math.floor(ms / 3600000);
    const main = (h ? h + ':' : '') + pad(Math.floor(ms / 60000) % 60) + ':' + pad(Math.floor(ms / 1000) % 60);
    return { main, cs: pad(Math.floor(ms / 10) % 100) };
  }

  function format(ms) {
    const p = parts(ms);
    return p.main + '.' + p.cs;
  }

  function renderTime(ms) {
    const p = parts(ms);
    const digits = [...p.main].map(ch => ch === ':' ? '<span class="c">:</span>' : `<span class="d">${ch}</span>`).join('');
    display.innerHTML = digits + `<span class="cs">.${p.cs}</span>`;
  }

  function renderLaps() {
    lapList.innerHTML = '';
    if (!running && elapsed === 0) return;
    let min = -1, max = -1;
    if (laps.length >= 2) {
      min = Math.min(...laps);
      max = Math.max(...laps);
    }
    const rows = [now() - lastLapTotal, ...laps.slice().reverse()];
    rows.forEach((ms, i) => {
      const li = document.createElement('li');
      const num = laps.length + 1 - i;
      let tag = '';
      if (i > 0 && ms === min) { li.className = 'best'; tag = '<span class="tag">최고</span>'; }
      else if (i > 0 && ms === max) { li.className = 'worst'; tag = '<span class="tag">느림</span>'; }
      li.innerHTML = `<span>🐾 랩 ${num}${tag}</span><span class="t">${format(ms)}</span>`;
      lapList.appendChild(li);
    });
  }

  function loop() {
    const t = now();
    renderTime(t);
    const cur = lapList.querySelector('li .t');
    if (cur) cur.textContent = format(t - lastLapTotal);
    rafId = requestAnimationFrame(loop);
  }

  function toggle() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      renderTime(elapsed);
      startBtn.textContent = '▶ 계속';
      startBtn.className = 'main';
      lapBtn.textContent = '↺ 리셋';
      setState('paused');
    } else {
      startTime = performance.now();
      running = true;
      startBtn.textContent = '⏸ 멈춤';
      startBtn.className = 'main pause';
      lapBtn.textContent = '🐾 랩';
      lapBtn.disabled = false;
      setState('running');
      renderLaps();
      loop();
    }
  }

  function lapOrReset() {
    if (running) {
      const total = now();
      laps.push(total - lastLapTotal);
      lastLapTotal = total;
      renderLaps();
    } else {
      reset();
    }
  }

  function reset() {
    cancelAnimationFrame(rafId);
    running = false;
    elapsed = 0;
    laps = [];
    lastLapTotal = 0;
    renderTime(0);
    lapList.innerHTML = '';
    startBtn.textContent = '▶ 시작';
    startBtn.className = 'main';
    lapBtn.textContent = '🐾 랩';
    lapBtn.disabled = true;
    setState('idle');
  }

  // falling sparkles in the window
  (function makeSparkles() {
    const g = document.getElementById('sparkles');
    const NS = 'http://www.w3.org/2000/svg';
    for (let i = 0; i < 22; i++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 46 + Math.random() * 308);
      c.setAttribute('cy', 10);
      c.setAttribute('r', 1.2 + Math.random() * 2);
      c.setAttribute('fill', '#fff');
      c.setAttribute('opacity', .5 + Math.random() * .5);
      const dur = 6 + Math.random() * 7;
      c.style.animation = `fall ${dur}s linear ${-Math.random() * dur}s infinite`;
      g.appendChild(c);
    }
  })();

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', lapOrReset);

  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lapOrReset(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running) reset(); }
  });

  renderTime(0);
</script>
</body>
</html>
